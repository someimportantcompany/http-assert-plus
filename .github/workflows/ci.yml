name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ./.nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run docs:build

  ci-versions:
    name: CI - node-${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 16.x
          - 18.x
          - 20.x
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Use node-${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  ci-success:
    needs: [test, versions]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Check all success or skipped
        run: echo "$NEEDS_JSON" | jq -e 'map(select(.result != "success" and .result != "skipped")) | length == 0' || exit 1
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
